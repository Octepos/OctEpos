name: OCTEPOS Invariant Enforcer

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  glass-floor-check:
    name: Evaluate Zero-State Invariants
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js Engine
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Execute Deterministic Invariant Suite
      run: npm run test:invariants
